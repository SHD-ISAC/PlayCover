name: Build & Release macOS App
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
env:
  CI: true
jobs:
  build:
    runs-on: macos-latest
    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get the version
        id: tag_version
        run: echo "TAG_NAME=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      - name: Install dependencies
        shell: bash
        run: |
          brew install swiftlint
          gem install fastlane
          bundle install
          pip install setuptools
          npm install https://github.com/PlayCover/create-dmg

      - name: Fastlane Release
        shell: bash
        run: fastlane release
        env:
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120 # x86 is slooooooow

      - name: Exract API_KEY
        shell: bash
        run: 'echo "$API_KEY" > apikey.json'
        env:
          API_KEY: ${{secrets.APPLE_API_KEY_JSON}}

      - name: Create DMG
        shell: bash
        run: |
          npx create-dmg ./output/PlayCover.app ./output
          mv ./output/*.dmg ./output/PlayCover_${{ env.TAG_NAME }}.dmg

      # Fail closed: do not publish or upload a DMG until notarization succeeds.
      - name: Notarize and staple DMG
        shell: bash
        run: |
          set -euo pipefail
          export NOTARY_KEY="$RUNNER_TEMP/playcover_notary_key.p8"
          ruby -rjson -e 'data = JSON.parse(File.read("apikey.json")); File.write(ENV.fetch("NOTARY_KEY"), data.fetch("key")); File.chmod(0600, ENV.fetch("NOTARY_KEY"))'
          key_id="$(ruby -rjson -e 'print JSON.parse(File.read("apikey.json")).fetch("key_id")')"
          issuer_id="$(ruby -rjson -e 'print JSON.parse(File.read("apikey.json")).fetch("issuer_id")')"
          xcrun notarytool submit "output/PlayCover_${{ env.TAG_NAME }}.dmg" \
            --key "$NOTARY_KEY" --key-id "$key_id" --issuer "$issuer_id" \
            --wait --timeout 30m
          xcrun stapler staple "output/PlayCover_${{ env.TAG_NAME }}.dmg"
          xcrun stapler validate "output/PlayCover_${{ env.TAG_NAME }}.dmg"

      - name: Clean Up
        if: always()
        shell: bash
        run: rm -f apikey.json "$RUNNER_TEMP/playcover_notary_key.p8"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayCover_${{ env.TAG_NAME }}.dmg
          path: output/PlayCover_${{ env.TAG_NAME }}.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            output/PlayCover_${{ env.TAG_NAME }}.dmg
